name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # If your branch is 'master', change 'main' to 'master'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://cis4930-assignment-02.onrender.com/api/data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # If your frontend is in a subfolder, change this to: ./frontend/dist
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
